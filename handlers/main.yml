---
# handlers file for nfs_server
- name: restart nfs RedHat-9
  systemd: 
    name: "{{ nfs_svc }}"
    state: restarted

- name: restart nfs RedHat-8
  systemd: 
    name: "{{ nfs_svc }}"
    state: restarted

- name: restart nfs RedHat-7
  systemd: 
    name: "{{ nfs_svc }}"
    state: restarted

- name: restart nfs RedHat-6
  service:
    name: "{{ nfs_svc }}"
    state: restarted

- name: restart nfs FreeBSD
  loop:
    - "{{ nfs_svc }}"
    - "{{ nfs_mountd_svc }}"
    - "{{ nfs_lockd_svc }}"
    - "{{ nfs_statd_svc }}"
  service:
    name: "{{ nfs_svc }}"
    state: restarted
