---
- name: make sure nfs server is enabled/started RHEL8-systemd
  systemd:
    name: "{{ item }}"
    enabled: true
    state: started
  loop:
    - nfs-server
  when:
    - ansible_distribution_major_version == "9" or ansible_distribution_major_version == "8"

- name: make sure nfs server is enabled/started RHEL7 - yum
  service:
    name: "{{ item }}" 
    enabled: true
    state: started
  loop:
    - nfs-server
  when: ansible_distribution_major_version == "7"
