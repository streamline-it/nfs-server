---
# tasks file for nfs_server
- name: inlude OS related variables
  ansible.builtin.include_vars: "./vars/{{ ansible_os_family }}.yml"

- name: call tasks to make sure needed packages are installed
  when: ansible_os_family == "RedHat"
  include_tasks: "{{ ansible_os_family }}_install_pkgs.yml"
 
- name: call tasks to make sure needed services are enabled started
  include_tasks: "{{ ansible_os_family }}_start_svc.yml"

- name: ensure standard ports are defaulted for nfs program for RHEL systems
  when: ansible_os_family == "RedHat"
  vars:
    notify_line: "restart nfs {{ ansible_os_family }}-{{ ansible_distribution_major_version }}"
  notify:
    "{{ notify_line }}"
  ansible.builtin.template:
    src: nfs.conf.j2
    dest: /etc/nfs.conf
    owner: root
    group: root
    mode: '0644'

- name: call tasks to make sure nfs exports config file is pushed
  ansible.builtin.include_tasks: ./tasks/push_exports_config.yml

- name: make sure nfs group is created
  ansible.builtin.group:
    name: "{{ nfs_group }}"
    state: present

- name: call tasks to make sure directories are created
  ansible.builtin.include_tasks: "./tasks/create_directories.yml"

- name: call tasks to make sure needed services are enabled/started
  ansible.builtin.include_tasks: "./tasks/{{ ansible_os_family }}_start_svc.yml"
