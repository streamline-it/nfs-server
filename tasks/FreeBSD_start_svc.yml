---
- name: ensure key variables have been defined to enable and configure nfs service
  ansible.builtin.assert:
    that: 
      - nfs_server_rc_vars is defined
      - nfs_server_mountd_port is defined
      - nfs_server_lockd_port is defined
      - nfs_server_statd_port is defined
    fail_msg: "make sure following vars are defined (nfs_server_rc_vars, nfs_server_mountd_port, nfs_server_lockd_port, nfs_server_statd_port)"

- name: make sure nfs server and related services are enabled FreeBSD host
  loop:
    "{{ nfs_server_rc_vars }}"
  ansible.builtin.lineinfile:
    path: /etc/rc.conf
    line: "{{ item['line'] }}"
    state: present

- name: ensure nfs ports are standardized
  notify: restart nfs FreeBSD
  loop:
    - 'mountd_flags="-r -p {{ nfs_server_mountd_port }}"'
    - 'rpc_lockd_flags="-p {{ nfs_server_lockd_port }}"'
    - 'rpc_statd_flags="-p {{ nfs_server_statd_port }}"'
  ansible.builtin.lineinfile:
    path: /etc/rc.conf
    line: "{{ item }}"
    state: present

- name: ensure nfs related service variables are defined before starting the service
  ansible.builtin.assert:
    that:
      - nfs_svc is defined
      - nfs_lockd_svc is defined
      - nfs_statd_svc is defined
    fail_msg: "Make sure following variables have been defined (nfs_svc, nfs_lockd_svc, nfs_statd_svc)"

- name: make sure nfs server and related services are started FreeBSD host
  loop:
    - "{{ nfs_svc }}"
    - "{{ nfs_lockd_svc }}"
    - "{{ nfs_statd_svc }}"
  service:
    name: "{{ item }}" 
    enabled: true
    state: started

- name: ensure mountd is restarted to pick up any changes to /etc/exports
  ansible.builtin.service:
    name: "{{ nfs_mouintd_svc }}" 
    enabled: true
    state: restarted
